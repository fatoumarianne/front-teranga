<div class="boite">
  <div class="carte">
    <h1 class="page-titre text-center">Connexion</h1>
    <p class="sous-titre">Accédez à votre espace de réservation</p>

    <form (submit)="$event.preventDefault(); seConnecter()">
      <div class="mb-3">
        <label class="form-label" for="email">Adresse e-mail</label>
        <input id="email" type="email" class="form-control" autocomplete="email"
               [value]="email()" (input)="email.set(valeur($event))" required>
      </div>

      <div class="mb-3">
        <label class="form-label" for="mdp">Mot de passe</label>
        <input id="mdp" type="password" class="form-control" autocomplete="current-password"
               [value]="motDePasse()" (input)="motDePasse.set(valeur($event))" required>
      </div>

      @if (erreur()) {
        <div class="alert alert-danger py-2">{{ erreur() }}</div>
      }

      <button type="submit" class="btn btn-primary w-100" [disabled]="enCours()">
        @if (enCours()) {
          Connexion en cours…
        } @else {
          Se connecter
        }
      </button>
    </form>

    <p class="text-center mt-3 mb-0 lien-inscription">
      Pas encore de compte ?
      <a routerLink="/inscription">Créer un compte</a>
    </p>
  </div>
</div>
