<?xml version="1.0" encoding="UTF-8"?>
<!--
  Motif de fond de la banniere : les lignes d'un terrain vu de dessus.

  Le trace est volontairement geometrique et monochrome. Il est pose en
  tres faible opacite sur le degrade bleu de la banniere, ce qui donne de
  la matiere a l'image sans attirer l'oeil hors du texte.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600"
     preserveAspectRatio="xMidYMid slice" aria-hidden="true">

  <g fill="none" stroke="#ffffff" stroke-width="4">

    <!-- limites du terrain -->
    <rect x="60" y="60" width="1080" height="480" rx="6"/>

    <!-- ligne et rond central -->
    <path d="M600 60 V540"/>
    <circle cx="600" cy="300" r="112"/>
    <circle cx="600" cy="300" r="10" fill="#ffffff" stroke="none"/>

    <!-- surfaces de reparation -->
    <rect x="60" y="150" width="190" height="300" rx="4"/>
    <rect x="950" y="150" width="190" height="300" rx="4"/>

    <!-- arcs de lancer franc -->
    <path d="M250 180 A 140 120 0 0 1 250 420"/>
    <path d="M950 180 A 140 120 0 0 0 950 420"/>

    <!-- corners -->
    <path d="M60 110 A 50 50 0 0 0 110 60"/>
    <path d="M1140 110 A 50 50 0 0 1 1090 60"/>
    <path d="M60 490 A 50 50 0 0 1 110 540"/>
    <path d="M1140 490 A 50 50 0 0 0 1090 540"/>
  </g>
</svg>
